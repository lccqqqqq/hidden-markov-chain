data_generator:
  # Process configuration with nested params
  process:
    name: "cylinder_graph"
    params:
      n: 6
      depth: 3
      tokens_per_cluster: 16
      dirichlet_alpha: 0.3
      p: 0.1
      seed: 42

  # Data generation settings
  num_tokens: 10_000_000
  save_dir: "data/datasets/cylinder_graph_hmm"

data:
  data_dir: "data/datasets/cylinder_graph_hmm_bpe"

model:
  n_layer: 4
  n_embd: 32
  n_head: 2
  d_head: 16
  vocab_size: 128
  n_ctx: 16
  activation_function: "relu"
  normalization_type: null
  attn_only: False
  d_mlp: 128
  tie_word_embeddings: True

train:
  optimizer:
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1e-8
    adam_weight_decay: 0.01
    learning_rate: 1e-3

  num_epochs: 10
  batch_size: 128
  seq_length: 16
  val_interval_in_opt_steps: 100
  log_interval_in_opt_steps: 10

wandb:
  project_name: "pcfg"
  experiment: "cylinder-graph-hmm-bpe"
  tags: ["bpe", "forward"]
  log_period: 3
